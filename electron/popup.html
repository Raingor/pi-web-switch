<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pi-web-switch 使用量</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #3b82f6;
      --card: #f9fafb;
      --positive: #10b981;
      --warn: #f59e0b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --fg: #e5e5e5;
        --muted: #9ca3af;
        --border: #374151;
        --accent: #60a5fa;
        --card: #2a2a2a;
        --positive: #34d399;
        --warn: #fbbf24;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 11px;
    }
    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }
    .refresh-btn:hover { color: var(--fg); border-color: var(--muted); }
    .section {
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .stat-label {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--fg);
    }
    .stat-value.tokens { color: var(--accent); }
    .stat-value.cost { color: var(--positive); }
    .stat-value.requests { color: var(--warn); }
    .stat-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }
    .sparkline {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 40px;
      padding: 4px 0;
    }
    .spark-bar {
      flex: 1;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
      min-height: 2px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .spark-bar:hover { opacity: 1; }
    .spark-labels {
      display: flex;
      gap: 3px;
      font-size: 9px;
      color: var(--muted);
    }
    .spark-labels span { flex: 1; text-align: center; }
    .provider-list {
      list-style: none;
    }
    .provider-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .provider-item:last-child { border-bottom: none; }
    .provider-name { color: var(--fg); }
    .provider-cost { color: var(--positive); font-variant-numeric: tabular-nums; }
    .footer {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--muted);
    }
    .footer button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .footer button:hover { opacity: 0.9; }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--muted);
      font-size: 13px;
    }
    .error {
      color: #ef4444;
      padding: 20px;
      text-align: center;
    }
    .updated-time {
      font-size: 10px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">加载使用量数据…</div>
  </div>
  <script type="module" src="./popup-render.ts"></script>
</body>
</html>
